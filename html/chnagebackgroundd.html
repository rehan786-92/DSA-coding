<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .para {
            height: 50%;

        }
    </style>
</head>

<body>

            x[0].style.backgroundColor ="black";
        }
    </script>
</body>
